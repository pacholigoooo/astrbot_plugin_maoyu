name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrbot_plugin_maoyu
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
        working-directory: astrbot_plugin_maoyu
      - run: python -m unittest discover -s tests -v
        working-directory: astrbot_plugin_maoyu
      - run: python tools/build_release.py
        working-directory: astrbot_plugin_maoyu
  framework:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        astrbot: ['4.9.2', '4.29.1']
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrbot_plugin_maoyu
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "astrbot==${{ matrix.astrbot }}" -r requirements.txt
        working-directory: astrbot_plugin_maoyu
      - run: python tools/framework_smoke.py
        working-directory: astrbot_plugin_maoyu

  koishi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
